<style>
/* 치비 머지: 같은 동물끼리 닿으면 한 단계 큰 동물로 합쳐지는 퍼즐. 폰 세로 우선. */
:root{
  --ink:#4A3A6B;--soft:#8C7FB0;--pink:#FF7EB6;--pink-deep:#E8559A;--gold:#FFC94D;--gold-deep:#E0A12E;--mint:#5ED6B4;--sky:#8FD3FF;
  --paper:#FFFBFE;--glass:rgba(255,255,255,.78);--line:rgba(255,255,255,.95);
  --f-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-num:"Fredoka","Jua",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:linear-gradient(180deg,rgba(255,240,250,.35),rgba(255,255,255,.15) 40%,rgba(236,244,255,.35)),url(assets/bg.webp) center/cover no-repeat,linear-gradient(180deg,#FDEBFA 0%,#EFE6FF 50%,#DDF1FF 100%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px))}

/* 위쪽 점수판 */
.hud{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.chip{display:grid;place-items:center;min-width:64px;padding:6px 12px;border-radius:16px;background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 14px rgba(140,110,200,.18)}
.chip small{font-size:11px;letter-spacing:.08em;color:var(--soft)}
.chip b{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.1}
.score{justify-self:start;min-width:110px}
.score b{font-size:26px;color:var(--pink-deep)}
.next{position:relative;width:62px;height:62px;padding:4px;border-radius:18px;background:var(--glass);border:2px solid var(--line);display:grid;place-items:center}
.next small{position:absolute;top:-8px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px}
.next img{width:48px;height:48px;object-fit:contain}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 12px rgba(140,110,200,.18);font-size:18px}

/* 게임판 */
#stage{position:relative;flex:1;min-height:0;margin-top:8px;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chain{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:6px;padding:4px 6px;border-radius:999px;background:rgba(255,255,255,.55)}
.chain img{width:24px;height:24px;object-fit:contain;filter:grayscale(1) opacity(.35);transition:filter .3s}
.chain img.on{filter:none}
.chain i{font-style:normal;font-size:9px;color:var(--soft)}

/* 알림 띠 */
.banner{position:absolute;left:50%;top:22%;z-index:6;pointer-events:none;transform:translate(-50%,-50%);padding:10px 22px;border-radius:999px;background:linear-gradient(90deg,#FFB6D9,#FFD27A);color:#fff;font-size:22px;white-space:nowrap;text-shadow:0 2px 0 rgba(200,90,140,.6);box-shadow:0 8px 24px rgba(232,85,154,.35);opacity:0}
.banner.go{animation:bannerIn 1.6s ease forwards}
.banner img{width:34px;height:34px;vertical-align:-9px;margin-right:6px}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* 덮개 화면 */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(74,58,107,.38)}
.overlay.title{background:linear-gradient(180deg,rgba(255,236,248,.25),rgba(239,230,255,.35)),url(assets/bg.webp) center/cover no-repeat,linear-gradient(180deg,#FDEBFA,#EFE6FF 55%,#DDF1FF)}
.hero{display:block;width:calc(100% + 36px);margin:-22px -18px 0;aspect-ratio:3/2;object-fit:cover;border-radius:25px 25px 0 0}
.hero + .logo{margin-top:-46px;position:relative}
.card{width:min(100%,400px);padding:22px 18px;border-radius:28px;background:var(--paper);border:3px solid #fff;box-shadow:0 18px 50px rgba(110,80,170,.28);display:grid;gap:12px;text-align:center}
.logo{margin:0;font-weight:400;font-size:clamp(52px,16vw,74px);line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 4px 0 #E8559A,0 0 0 #E8559A,3px 0 0 #E8559A,-3px 0 0 #E8559A,0 -3px 0 #E8559A,0 8px 18px rgba(232,85,154,.35)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:-.3s}.logo span:nth-child(3){animation-delay:-.6s}.logo span:nth-child(4){animation-delay:-.9s}
.tagline{margin:0;color:var(--soft);font-size:16px}
.parade{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;border-radius:20px;background:#F6F0FF}
.parade img{width:100%;aspect-ratio:1;object-fit:contain}
.parade img:nth-child(odd){animation:bob 2.2s ease-in-out infinite}
.parade img:nth-child(even){animation:bob 2.2s ease-in-out infinite;animation-delay:-1.1s}
.how{margin:0;font-size:14px;line-height:1.6;color:var(--ink)}
.how b{color:var(--pink-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:18px;font-size:20px;background:#fff;border:2.5px solid #EADFFF;box-shadow:0 5px 0 #D9CCF5;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D9CCF5}
.btn.main{background:linear-gradient(180deg,#FF9BC8,#FF6FAE);color:#fff;border-color:#fff;box-shadow:0 5px 0 #D9558F;text-shadow:0 2px 0 rgba(180,60,110,.5)}
.btn.main:active{box-shadow:0 2px 0 #D9558F}
.btn.gold{background:linear-gradient(180deg,#FFE08A,#FFC24D);color:#6B4A12;border-color:#fff;box-shadow:0 5px 0 var(--gold-deep)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.best{justify-self:center;padding:4px 14px;border-radius:999px;background:#FFF1D6;color:#9A6A12;font-size:15px}
.best b{font-family:var(--f-num)}
.r-title{margin:0;font-size:30px;color:var(--pink-deep);font-weight:400}
.r-score{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1}
.r-top{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;border-radius:18px;background:#F6F0FF}
.r-top img{width:64px;height:64px;object-fit:contain}
.r-top span{text-align:left;font-size:15px;color:var(--soft)}
.r-top b{display:block;font-size:20px;color:var(--ink)}
.newbest{justify-self:center;padding:3px 16px;border-radius:999px;background:var(--gold);color:#fff;text-shadow:0 1px 0 var(--gold-deep);animation:pulse .8s ease-in-out infinite}
.brag-text{width:100%;user-select:text;-webkit-user-select:text;border:2px solid #EADFFF;border-radius:14px;padding:8px;font:15px/1.5 var(--f-ui);color:var(--ink);resize:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;pointer-events:none;padding:10px 18px;border-radius:16px;background:rgba(74,58,107,.92);color:#fff;font-size:15px;max-width:90vw;text-align:center}
/* 홈페이지 랭킹 */
.rank-row input{user-select:text;-webkit-user-select:text}
.rankbox{display:grid;gap:6px;padding:10px;border-radius:18px;background:#FFF4FA;border:2px dashed #FFC2DD}
.rank-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.rank-row input{width:150px;padding:9px 12px;border-radius:999px;border:2px solid #FFD0E6;background:#fff;font-family:var(--f-ui);font-size:16px;color:var(--ink);text-align:center}
.rank-row .btn{min-height:42px;font-size:15px;padding:0 14px}
.rank-msg{margin:0;font-size:13px;color:var(--soft)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (max-height:640px){.parade{display:none}.card{gap:10px;padding:18px 16px}.hero{margin:-18px -16px 0;width:calc(100% + 32px)}}
.rotate{position:fixed;inset:0;z-index:40;display:none;place-items:center;align-content:center;gap:10px;background:linear-gradient(180deg,#FDEBFA,#DDF1FF);color:var(--ink);font-size:22px;text-align:center}
.rotate b{font-size:48px}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="hud">

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const SHARE_URL = 'https://baed73117.github.io/ai-astra/chibimerge/';
const TOUCH = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- 단계 (작은 동물 → 큰 동물). 그림은 코덱스 작화, r = 그림 한 변 대비 몸통 반지름 ---------- */
const TIERS = [null,
  {name: '병아리', color: 0xFFD84D, r: .4722},
  {name: '햄스터', color: 0xF2A65A, r: .4869},
  {name: '아기 고양이', color: 0xB3A6D9, r: .4869},
  {name: '토끼', color: 0xFFA9C9, r: .4873},
  {name: '강아지', color: 0xE0B07A, r: .4874},
  {name: '펭귄', color: 0x5AA8F0, r: .4658},
  {name: '여우', color: 0xFF8A3D, r: .4751},
  {name: '판다', color: 0x6B6478, r: .4848},
  {name: '곰', color: 0xB97A4A, r: .4871},
  {name: '사자', color: 0xF5B53D, r: .4883},
  {name: '고래', color: 0x3D5CC2, r: .4215},
  {name: '우주 별 요정', color: 0xC9A8FF, r: .488},
];
const MAX = 11;                                       // 고래 + 고래 → 우주 별 요정 (보너스 후 사라짐)
const RAD = [0, 25, 33, 43, 53, 64, 77, 91, 106, 123, 141, 162];   // 물리 세계 반지름
const POINTS = [0, 0, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];      // 그 단계가 새로 생기면 점수
const STAR_BONUS = 120;
const DROP_W = [0, 30, 26, 20, 14, 10];               // 떨어뜨릴 동물(1~5단계) 확률 가중치
const TEX_URL = t => `assets/t${String(t).padStart(2, '0')}.webp`;

/* ---------- 물리 세계 크기 ---------- */
const WW = 600, WH = 940;
const WALL_L = 22, WALL_R = 578, FLOOR = 912, DANGER = 196, DROP_Y = 112;

/* ---------- 저장 ---------- */
const SAVE_KEY = 'chibimerge-v1';
const save = (() => {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) { s = {}; }
  const n = v => Math.max(0, Math.floor(Number(v) || 0));
  return {best: n(s.best), plays: n(s.plays), maxTier: Math.min(MAX + 1, n(s.maxTier)), muted: s.muted === true};
})();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const fmt = n => Number(n).toLocaleString('ko-KR');

/* ---------- 소리 (파일 없이 코드로) ---------- */
const S = {
  ctx: null, master: null, music: null, beat: 0, next: 0, timer: 0,
  init() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
        this.music = this.ctx.createGain(); this.music.gain.value = .5; this.music.connect(this.master);
      } catch (e) { this.ctx = null; return; }
    }
    this.master.gain.value = save.muted ? 0 : 1;
    if (this.ctx.state !== 'running' && this.ctx.state !== 'closed' && !document.hidden) this.ctx.resume().catch(() => {});
  },
  tone(f, d = .12, type = 'sine', vol = .14, slide = 1, delay = 0, out) {
    if (!this.ctx || save.muted || document.hidden) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(out || this.master); o.start(t); o.stop(t + d + .03);
  },
  drop() { this.tone(520, .08, 'sine', .07, .7); },
  pop(t) { const f = 900 * Math.pow(.9, t); this.tone(f, .14, 'sine', .16, 1.8); this.tone(f * 1.5, .1, 'triangle', .05, 1.6, .03); },
  newTier() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, .16, 'triangle', .1, 1, i * .07)); },
  star() { [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, .26, 'triangle', .11, 1, i * .07)); },
  warn() { this.tone(330, .12, 'square', .03); },
  over() { [659, 523, 440, 330].forEach((f, i) => this.tone(f, .3, 'triangle', .1, 1, i * .14)); },
  // 배경음: 부드러운 오르골 아르페지오 (화면이 숨겨지면 멈춤)
  startMusic() {
    if (!this.ctx || this.timer) return;
    const CH = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
    const mt = m => 440 * Math.pow(2, (m - 69) / 12);
    this.next = this.ctx.currentTime + .1;
    this.timer = setInterval(() => {
      if (!this.ctx || save.muted || document.hidden) { this.next = this.ctx ? this.ctx.currentTime + .1 : 0; return; }
      while (this.next < this.ctx.currentTime + .3) {
        const ch = CH[Math.floor(this.beat / 8) % 4], step = this.beat % 8;
        const n = ch[[0, 1, 2, 3, 2, 1, 2, 3][step]] + 12;
        this.tone(mt(n), .34, 'sine', .035, 1, this.next - this.ctx.currentTime, this.music);
        if (step === 0) this.tone(mt(ch[0] - 12), .9, 'triangle', .03, 1, this.next - this.ctx.currentTime, this.music);
        this.beat++; this.next += .24;
      }
    }, 90);
  },
};

/* ---------- 홈페이지 랭킹 (구글 시트) · 깃허브 홈페이지에서만 켜짐 ---------- */
const RANK_URL = 'https://script.google.com/macros/s/AKfycbxZd7p2170PY_5dziBDyKevWCDt5Eth3L0gTGQB_ufVPdT5ksF66qwDr6rlBceJvfFO0w/exec';
const RankNet = {
  on: !!RANK_URL && /(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname),
  id() {
    try {
      let v = localStorage.getItem('astra-rank-id');

      if (!v || !/^r[0-9a-f]{15,31}$/.test(v)) { v = 'r' + Array.from(crypto.getRandomValues(new Uint8Array(11)), b => b.toString(16).padStart(2, '0')).join(''); localStorage.setItem('astra-rank-id', v); }

  },
  get name() { try { return localStorage.getItem('astra-rank-name') || ''; } catch (e) { return ''; } },
  set name(v) { try { localStorage.setItem('astra-rank-name', v); } catch (e) {} },
  sent(game) { try { return Number(localStorage.getItem('astra-rank-sent-' + game)) || 0; } catch (e) { return 0; } },
  // 15초 넘게 답이 없으면 그만 기다린다 (폰 인터넷이 끊겨도 버튼이 멈추지 않게)
  async req(opt) {
    const ac = typeof AbortController === 'function' ? new AbortController() : null, t = ac && setTimeout(() => ac.abort(), 15000);
    try { const r = await fetch(RANK_URL, Object.assign({}, opt, ac ? {signal: ac.signal} : {})); return await r.json(); }
    finally { if (t) clearTimeout(t); }
  },
  async send(game, name, score, info) {
    // 0428, 1/2 처럼 숫자·날짜로 보이는 닉네임은 시트가 바꿔 버리지 않게 앞에 보이지 않는 글자를 붙인다

  top() { return this.req({cache: 'no-store'}); },
};
// 결과 화면의 '랭킹에 올리기' 상자. 이름이 저장돼 있고 새 최고 기록이면 자동으로 올린다

class Fx {

  spawn(tex, o) {

}

let lastW = 0, lastH = 0;

/* ---------- 물리 ---------- */
const {Engine, Bodies, Composite, Body, Events} = window.Matter || {};
let engine = null;
function initPhysics() {
  engine = Engine.create({enableSleeping: false});
  engine.gravity.y = 1; engine.gravity.scale = .0016;
  engine.positionIterations = 8; engine.velocityIterations = 6;
  const opt = {isStatic: true, friction: .3, restitution: .05};
  Composite.add(engine.world, [
    Bodies.rectangle(WALL_L - 60, WH / 2, 120, WH * 3, opt),
    Bodies.rectangle(WALL_R + 60, WH / 2, 120, WH * 3, opt),
    Bodies.rectangle(WW / 2, FLOOR + 60, WW * 2, 120, opt),
  ]);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);
}
const merges = [];
function onCollide(ev) {
  for (const pr of ev.pairs) {
    const a = pr.bodyA, b = pr.bodyB;
    if (a.tier && a.tier === b.tier && !a.gone && !b.gone) { a.gone = b.gone = true; merges.push([a, b]); }
  }
}
function addPiece(tier, x, y, popIn) {
  const body = Bodies.circle(x, y, RAD[tier], {restitution: .12, friction: .18, frictionStatic: .45, frictionAir: .008, density: .0012, slop: .03});
  body.tier = tier; body.gone = false;
  const sp = new PIXI.Sprite(TEX[tier]); sp.anchor.set(.5);
  const size = RAD[tier] / TIERS[tier].r; sp.base = size / sp.texture.width; sp.scale.set(popIn ? sp.base * .55 : sp.base); sp.k = popIn ? .55 : 1;
  sp.position.set(x, y); L.pieces.addChild(sp);
  const p = {body, sp, tier, born: performance.now(), px: x, py: y, pa: 0};
  body.piece = p; pieces.add(p); Composite.add(engine.world, body);
  return p;
}
function removePiece(p) {
  pieces.delete(p); Composite.remove(engine.world, p.body);
  L.pieces.removeChild(p.sp); p.sp.destroy();
}
function clearPieces() { [...pieces].forEach(removePiece); merges.length = 0; }

/* ---------- 게임 상태 ---------- */
let state = 'title', paused = false, score = 0, runMax = 1, held = 0, next = 1, aimX = WW / 2, aiming = false, canDrop = false;
let combo = 0, lastMerge = 0, dangerT = 0, warnT = 0, acc = 0, dropTimer = 0, overT = 0;
let lerpA = 1, inputLock = 0, bigBannerUntil = 0, lastPX = null, starting = false, stageRect = null;
const STEP = 1000 / 60;

function rollTier() {
  let total = 0; for (let t = 1; t <= 5; t++) total += DROP_W[t];
  let r = Math.random() * total;
  for (let t = 1; t <= 5; t++) { r -= DROP_W[t]; if (r < 0) return t; }
  return 1;
}
function clampAim(x, t) { const r = RAD[t || 1]; return Math.max(WALL_L + r + 1, Math.min(WALL_R - r - 1, x)); }
function setHeld(t) {
  held = t; canDrop = t > 0;
  L.held.visible = t > 0;
  L.heldGlow.visible = t > 0;
  if (t) { L.held.texture = TEX[t]; L.held.scale.set(RAD[t] / TIERS[t].r / L.held.texture.width); L.heldGlow.scale.set(RAD[t] * 3.2 / 64); L.heldGlow.tint = TIERS[t].color; aimX = clampAim(aimX, t); }
  drawGuide();
}
function drawGuide() {
  const on = held && state === 'play';
  L.guide.children.forEach((g, i) => { g.visible = on && held === i + 1; });
  if (!on) return;
  L.guide.x = aimX;
  L.held.position.set(aimX, DROP_Y);
}
function setNext(t) { next = t; $('#nextImg').src = TEX_URL(t); }

function updateScore() { $('#score').textContent = fmt(score); }
function renderChain() {
  const c = $('#chain'); c.innerHTML = '';
  for (let t = 1; t <= MAX; t++) {
    const im = document.createElement('img'); im.src = TEX_URL(t); im.alt = TIERS[t].name; im.title = TIERS[t].name;

async function startGame() {
  if (starting) return;
  starting = true;
  try { await startInner(); } finally { starting = false; }
}
async function startInner() {
  keepBest();
  S.init(); S.startMusic();
  $('#btnStart').disabled = true; $('#btnStart').textContent = '불러오는 중…';
  try { await initGraphics(); }
  catch (e) { toast('이 브라우저에서는 게임 그래픽을 켤 수 없어요. 크롬이나 사파리 최신 버전으로 열어 주세요.'); return; }
  finally { $('#btnStart').disabled = false; $('#btnStart').textContent = '게임 시작'; }
  if (!engine) initPhysics();

  ['#title', '#result', '#pause'].forEach(s => { $(s).hidden = true; });

  aimX = WW / 2;

}
// 판 도중에 나가거나 다시 시작해도 최고 기록은 남긴다
function keepBest() { if (state === 'play' && score > save.best) { save.best = score; persist(); } }

function drop() {
  if (state !== 'play' || paused || !canDrop || !held) return;
  const t = held;
  const p = addPiece(t, aimX, DROP_Y, false);
  Body.setVelocity(p.body, {x: 0, y: 2});
  S.drop();
  combo = 0;
  setHeld(0);
  clearTimeout(dropTimer);
  dropTimer = setTimeout(() => {
    if (state !== 'play') return;
    if (aiming !== false && lastPX !== null) aimX = lastPX;   // 누르고 있던 손가락 자리로
    setHeld(next); setNext(rollTier());
  }, 480);
}

function doMerges(now) {
  for (const [a, b] of merges) {
    const pa = a.piece, pb = b.piece; if (!pa || !pb || !pieces.has(pa) || !pieces.has(pb)) continue;
    const t = pa.tier, x = (a.position.x + b.position.x) / 2, y = (a.position.y + b.position.y) / 2;
    const vx = (a.velocity.x + b.velocity.x) / 2, vy = Math.min(0, (a.velocity.y + b.velocity.y) / 2);
    removePiece(pa); removePiece(pb);
    combo++; lastMerge = now;
    if (t < MAX) {
      const nt = t + 1;
      // 벽·바닥에 파고들지 않게 위치를 안쪽으로
      const p = addPiece(nt, Math.max(WALL_L + RAD[nt], Math.min(WALL_R - RAD[nt], x)), Math.min(FLOOR - RAD[nt], y), true);
      Body.setVelocity(p.body, {x: vx, y: vy});
      const gain = POINTS[nt] + Math.min(20, Math.max(0, combo - 1) * 2);
      score += gain; updateScore();
      popFx(x, y, nt); floatText('+' + gain, x, y - RAD[nt] * .4);
      S.pop(nt);
      if (combo >= 3 && now > bigBannerUntil) showBanner(`연쇄 ×${combo}!`);
      if (nt > runMax) { runMax = nt; renderChain(); }
      if (nt > save.maxTier) { save.maxTier = nt; persist(); showBanner(`NEW! ${TIERS[nt].name}`, nt); bigBannerUntil = now + 1400; S.newTier(); }
      if (nt >= 8) shake = Math.min(14, 4 + nt);
    } else {
      // 고래 + 고래 → 우주 별 요정 등장!
      score += STAR_BONUS; updateScore();
      starFx(x, y); floatText('+' + STAR_BONUS, x, y);
      if (save.maxTier < MAX + 1) { save.maxTier = MAX + 1; persist(); }
      runMax = Math.max(runMax, MAX); renderChain();
      showBanner('우주 별 요정 등장!', MAX + 1); bigBannerUntil = now + 1600; S.star(); shake = 16;
    }
  }
  merges.length = 0;
}

function popFx(x, y, t) {
  const c = TIERS[t].color, r = RAD[t];
  fx.spawn(TEX.ring, {x, y, tint: c, s0: r / 64, s1: r / 64 * 2.1, a0: .9, a1: 0, life: .35});
  fx.spawn(TEX.spark, {x, y, tint: 0xFFFFFF, s0: r / 18, s1: r / 26, a0: .85, a1: 0, life: .22, add: true});
  const n = REDUCED ? 4 : TOUCH ? 8 : 14;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (180 + Math.random() * 260) * (1 + r / 120);
    fx.spawn(i % 3 ? TEX.spark : TEX.star, {x: x + Math.cos(a) * r * .5, y: y + Math.sin(a) * r * .5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, g: 700, tint: i % 2 ? c : 0xFFFFFF, s0: .5 + Math.random() * .5, s1: 0, life: .45 + Math.random() * .25, vr: 6, add: true});
  }
}
function starFx(x, y) {
  const sp = new PIXI.Sprite(TEX[MAX + 1]); sp.anchor.set(.5); sp.position.set(x, y); sp.scale.set(.2); world.addChild(sp);
  starRise.push({sp, t: 0});
  const n = REDUCED ? 8 : TOUCH ? 24 : 40;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 300 + Math.random() * 500;
    fx.spawn(i % 2 ? TEX.star : TEX.spark, {x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 300, tint: [0xFFE38A, 0xFF9AD5, 0x8FD3FF, 0xC9A8FF][i % 4], s0: .9, s1: 0, life: .9, vr: 5, add: true});
  }
}
const starRise = [];
function floatText(txt, x, y) {
  const t = L.texts.find(o => !o.visible) || L.texts[0];
  t.text = txt; t.position.set(x, y); t.visible = true; t.life = .8; t.alpha = 1; t.scale.set(.6);
}
let bannerTimer = 0;
function showBanner(text, tier) {
  const b = $('#banner');
  b.innerHTML = ''; if (tier) { const im = document.createElement('img'); im.src = TEX_URL(tier); im.alt = ''; b.appendChild(im); }
  b.appendChild(document.createTextNode(text));
  b.classList.remove('go'); requestAnimationFrame(() => requestAnimationFrame(() => b.classList.add('go')));
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('go'), 1700);
}

function tick() {
  const dtMs = Math.min(100, app.ticker.deltaMS), dt = dtMs / 1000, now = performance.now();
  if (app.screen.width !== lastW || app.screen.height !== lastH) layout();
  if (state === 'play' && !paused) {
    acc += dtMs; let n = 0;
    // 고정 박자(1/60초)로 계산하고, 그릴 때는 직전 계산과 섞어서 끊김 없이 보이게 한다
    while (acc >= STEP - 1 && n < 4) {
      for (const p of pieces) { p.px = p.body.position.x; p.py = p.body.position.y; p.pa = p.body.angle; }
      Engine.update(engine, STEP); doMerges(now); acc -= STEP; n++;
    }
    if (n === 4) acc = 0;
    lerpA = Math.max(0, Math.min(1, acc / STEP));
    // 점선 위로 쌓였는지 (방금 떨어뜨렸거나 막 합쳐진 동물은 잠깐 봐줌)
    let above = false;
    for (const p of pieces) if (now - p.born > 1300 && p.body.position.y - RAD[p.tier] < DANGER) { above = true; break; }
    dangerT = above ? dangerT + dt : Math.max(0, dangerT - dt * 2);
    L.danger.alpha = above ? .55 + .45 * Math.sin(now / 90) : .35;
    L.dangerGlow.alpha = above ? Math.min(1, dangerT * 1.2) * (.6 + .4 * Math.sin(now / 110)) : Math.max(0, L.dangerGlow.alpha - dt * 3);
    if (above) { warnT -= dt; if (warnT <= 0) { warnT = .5; S.warn(); } } else warnT = 0;
    if (dangerT > 2) gameOver();
  }
  // 그림 따라가기
  const k = state === 'play' && !paused ? lerpA : 1;
  for (const p of pieces) {
    const b = p.body;
    p.sp.position.set(p.px + (b.position.x - p.px) * k, p.py + (b.position.y - p.py) * k); p.sp.rotation = p.pa + (b.angle - p.pa) * k;
    if (p.sp.k < 1) { p.sp.k = Math.min(1, p.sp.k + dt * 5); p.sp.scale.set(p.sp.base * (p.sp.k < 1 ? p.sp.k + Math.sin(p.sp.k * Math.PI) * .25 : 1)); }
  }
  if (state === 'play' && held) { L.held.position.set(aimX, DROP_Y + Math.sin(now / 300) * 3); L.heldGlow.position.set(aimX, DROP_Y); }
  for (let i = starRise.length - 1; i >= 0; i--) {
    const s = starRise[i]; s.t += dt;
    s.sp.scale.set(Math.min(.9, .2 + s.t * 1.6)); s.sp.y -= dt * 160; s.sp.alpha = s.t < 1.2 ? 1 : Math.max(0, 1 - (s.t - 1.2) * 2);
    if (s.t > 1.7) { world.removeChild(s.sp); s.sp.destroy(); starRise.splice(i, 1); }
  }
  for (const t of L.texts) if (t.visible) { t.life -= dt; t.y -= dt * 70; t.scale.set(Math.min(1, t.scale.x + dt * 4)); t.alpha = Math.min(1, t.life * 2.5); if (t.life <= 0) t.visible = false; }
  fx.update(dt);
  shake *= Math.exp(-dt * 9);
  world.position.set(offX + (Math.random() - .5) * shake * scale, offY + (Math.random() - .5) * shake * scale);
  if (state !== 'play' && !fx.ps.length && !starRise.length && shake < .2) { overT += dt; if (overT > .6) app.stop(); }
}

function gameOver() {
  if (state !== 'play') return;
  state = 'over'; setHeld(0); clearTimeout(dropTimer); overT = 0;
  S.over();
  const isBest = score > save.best && score > 0;
  if (isBest) save.best = score;
  persist();
  $('#bestHud').textContent = fmt(save.best);
  $('#rScore').textContent = fmt(score);
  $('#rNew').hidden = !isBest;
  $('#rTopImg').src = TEX_URL(runMax); $('#rTopName').textContent = TIERS[runMax].name;
  $('#rTitle').textContent = isBest ? '최고 기록 달성!' : '게임 끝!';
  $('#bragText').hidden = true;
  const info = '최고 ' + TIERS[runMax].name, endScore = score;
  if (rankSupported) RankUI.show('chibimerge', endScore, info);
  else {
    $('#rankBox').hidden = true;
    if (RankNet.on) checkRank().then(ok => { if (ok && state === 'over') RankUI.show('chibimerge', endScore, info); });
  }
  setTimeout(() => { if (state === 'over') { $('#result').hidden = false; lockCard($('#result .card')); } }, 650);
}
function lockCard(el) { el.style.pointerEvents = 'none'; setTimeout(() => { el.style.pointerEvents = ''; }, 500); }

function goTitle() {
  keepBest();
  state = 'title'; paused = false; clearTimeout(dropTimer); S.init();
  if (app) app.start();
  if (engine) clearPieces(); if (fx) fx.clear();
  ['#result', '#pause'].forEach(s => { $(s).hidden = true; });
  $('#title').hidden = false; lockCard($('#title .card'));
  renderTitle();
}
function renderTitle() {
  $('#bestTitle').textContent = fmt(save.best); $('#bestHud').textContent = fmt(save.best);
  const pr = $('#parade'); pr.innerHTML = '';
  for (let t = 1; t <= MAX + 1; t++) { const im = document.createElement('img'); im.src = TEX_URL(t); im.alt = TIERS[t].name; im.title = TIERS[t].name; pr.appendChild(im); }
  renderChain(); soundLabels();
}
function pauseGame() {
  if (state !== 'play' || paused) return;
  paused = true; aiming = false; $('#pause').hidden = false;
  setTimeout(() => { if (paused && app) app.stop(); }, 120);
}
function resumeGame() {
  if (!paused) return;
  paused = false; acc = 0; $('#pause').hidden = true; S.init();
  if (app) app.start();
  inputLock = performance.now() + 350;
}

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
function soundLabels() { const txt = save.muted ? '🔇 소리 꺼짐' : '🔊 소리 켜짐'; $('#btnSound').textContent = txt; $('#btnSound2').textContent = txt; }
function toggleSound() { save.muted = !save.muted; persist(); S.init(); soundLabels(); }

async function brag() {
  const text = `치비 머지 ${fmt(score)}점! 이번 판 최고는 ${TIERS[runMax].name} 🐾\n나도 해 볼래? → ${SHARE_URL}`;
  const box = $('#bragText');
  try { await navigator.clipboard.writeText(text); box.hidden = true; toast('복사했어요! 카톡에 붙여 넣어 보내 보세요.'); }
  catch (e) { box.value = text; box.hidden = false; box.focus(); box.select(); toast('아래 글을 길게 눌러 복사해 주세요.'); }
}

/* ---------- 입력 ---------- */
const stage = $('#stage');
function worldX(clientX) { const r = stageRect || (stageRect = stage.getBoundingClientRect()); return (clientX - r.left - offX) / scale; }
window.addEventListener('resize', () => { stageRect = null; });
stage.addEventListener('pointerdown', e => {
  if (state !== 'play' || paused || e.button > 0 || performance.now() < inputLock) return;
  e.preventDefault(); S.init();
  aiming = e.pointerId; lastPX = worldX(e.clientX);
  if (held) { aimX = clampAim(lastPX, held); drawGuide(); }
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
stage.addEventListener('pointermove', e => {
  if (state !== 'play' || paused) return;
  if (aiming === e.pointerId || (aiming === false && e.pointerType === 'mouse')) {
    lastPX = worldX(e.clientX);
    if (held) { aimX = clampAim(lastPX, held); drawGuide(); }
  }
});
stage.addEventListener('pointerup', e => {
  if (aiming !== e.pointerId) return;
  aiming = false;
  if (held) { aimX = clampAim(worldX(e.clientX), held); drop(); }
});
stage.addEventListener('pointercancel', e => { if (aiming === e.pointerId) aiming = false; });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (paused) resumeGame(); else pauseGame(); return; }
  if (state !== 'play' || paused || !held) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); aimX = clampAim(aimX - 18, held); drawGuide(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); aimX = clampAim(aimX + 18, held); drawGuide(); }
  else if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); drop(); }
});

$('#btnStart').addEventListener('click', startGame);
$('#btnAgain').addEventListener('click', startGame);
$('#btnRestart').addEventListener('click', startGame);
$('#btnHome').addEventListener('click', goTitle);
$('#btnQuit').addEventListener('click', goTitle);
$('#btnPause').addEventListener('click', pauseGame);
$('#btnResume').addEventListener('click', resumeGame);
$('#btnBrag').addEventListener('click', brag);
$('#btnSound').addEventListener('click', toggleSound);
$('#btnSound2').addEventListener('click', toggleSound);
$('#btnRankUp').addEventListener('click', () => RankUI.up(false));
$('#rankName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); RankUI.up(false); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); if (S.ctx) S.ctx.suspend().catch(() => {}); } else if (S.ctx && !paused) S.init(); });

// 랭킹: 시트가 이 게임을 받을 준비가 됐을 때만 '랭킹에 올리기'를 보여 준다
let rankSupported = false;
function checkRank() {
  return RankNet.top().then(j => (rankSupported = !!(j && j.ok && j.top && Object.prototype.hasOwnProperty.call(j.top, 'chibimerge')))).catch(() => false);
}
if (RankNet.on) checkRank();
// 폰을 가로로 돌리면 잠깐 멈춤
const landMQ = window.matchMedia ? matchMedia('(orientation: landscape) and (max-height: 500px) and (pointer: coarse)') : null;
if (landMQ) { const onLand = () => { if (landMQ.matches) pauseGame(); }; if (landMQ.addEventListener) landMQ.addEventListener('change', onLand); else if (landMQ.addListener) landMQ.addListener(onLand); }

renderTitle();
initGraphics().catch(() => {});
})();
</script>
