<style>
:root{
  --ink:#4A3A6B;--soft:#8C7FB0;--pink:#FF7EB6;--pink-deep:#E8559A;--gold:#FFC94D;--gold-deep:#E0A12E;--mint:#5ED6B4;--sky:#8FD3FF;
  --paper:#FFFBFE;--glass:rgba(255,255,255,.78);--line:rgba(255,255,255,.95);
  --f-ui:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-num:"Fredoka","Jua",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:linear-gradient(180deg,rgba(255,240,250,.35),rgba(255,255,255,.15) 40%,rgba(236,244,255,.35)),url(assets/bg.webp) center/cover no-repeat,linear-gradient(180deg,#FDEBFA 0%,#EFE6FF 50%,#DDF1FF 100%);background-attachment:fixed}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 10px calc(8px + env(safe-area-inset-bottom,0px))}
.hud{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:8px}
.chip{display:grid;place-items:center;min-width:64px;padding:6px 12px;border-radius:16px;background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 14px rgba(140,110,200,.18)}
.chip small{font-size:11px;letter-spacing:.08em;color:var(--soft)}
.chip b{font-family:var(--f-num);font-weight:700;font-size:20px;line-height:1.1}
.score{justify-self:start;min-width:110px}
.score b{font-size:26px;color:var(--pink-deep)}
.next{position:relative;width:62px;height:62px;padding:4px;border-radius:18px;background:var(--glass);border:2px solid var(--line);display:grid;place-items:center}
.next small{position:absolute;top:-8px;left:50%;transform:translateX(-50%);padding:1px 8px;border-radius:999px;background:var(--pink);color:#fff;font-size:11px}
.next img{width:48px;height:48px;object-fit:contain}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:2px solid var(--line);box-shadow:0 4px 12px rgba(140,110,200,.18);font-size:18px}
#stage{position:relative;flex:1;min-height:0;margin-top:8px;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chain{display:flex;justify-content:center;align-items:center;gap:2px;margin-top:6px;padding:4px 6px;border-radius:999px;background:rgba(255,255,255,.55)}
.chain img{width:24px;height:24px;object-fit:contain;filter:grayscale(1) opacity(.35);transition:filter .3s}
.chain img.on{filter:none}
.chain i{font-style:normal;font-size:9px;color:var(--soft)}
.banner{position:absolute;left:50%;top:36%;z-index:6;pointer-events:none;transform:translate(-50%,-50%);padding:10px 22px;border-radius:999px;background:linear-gradient(90deg,#FFB6D9,#FFD27A);color:#fff;font-size:22px;white-space:nowrap;text-shadow:0 2px 0 rgba(200,90,140,.6);box-shadow:0 8px 24px rgba(232,85,154,.35);opacity:0}
.banner.go{animation:bannerIn 1.6s ease forwards}
.banner img{width:34px;height:34px;vertical-align:-9px;margin-right:6px}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(74,58,107,.38)}
.overlay.title{background:linear-gradient(180deg,rgba(255,236,248,.25),rgba(239,230,255,.35)),url(assets/bg.webp) center/cover no-repeat,linear-gradient(180deg,#FDEBFA,#EFE6FF 55%,#DDF1FF)}
.hero{display:block;width:calc(100% + 36px);margin:-22px -18px 0;aspect-ratio:3/2;object-fit:cover;border-radius:25px 25px 0 0}
.hero + .logo{margin-top:-46px;position:relative}
.card{width:min(100%,400px);padding:22px 18px;border-radius:28px;background:var(--paper);border:3px solid #fff;box-shadow:0 18px 50px rgba(110,80,170,.28);display:grid;gap:12px;text-align:center}
.logo{margin:0;font-weight:400;font-size:clamp(52px,16vw,74px);line-height:1;color:#fff;letter-spacing:.02em;text-shadow:0 4px 0 #E8559A,0 0 0 #E8559A,3px 0 0 #E8559A,-3px 0 0 #E8559A,0 -3px 0 #E8559A,0 8px 18px rgba(232,85,154,.35)}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span:nth-child(2){animation-delay:-.3s}.logo span:nth-child(3){animation-delay:-.6s}.logo span:nth-child(4){animation-delay:-.9s}
.tagline{margin:0;color:var(--soft);font-size:16px}
.parade{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;border-radius:20px;background:#F6F0FF}
.parade img{width:100%;aspect-ratio:1;object-fit:contain}
.parade img:nth-child(odd){animation:bob 2.2s ease-in-out infinite}
.parade img:nth-child(even){animation:bob 2.2s ease-in-out infinite;animation-delay:-1.1s}
.how{margin:0;font-size:14px;line-height:1.6;color:var(--ink)}
.how b{color:var(--pink-deep)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:18px;font-size:20px;background:#fff;border:2.5px solid #EADFFF;box-shadow:0 5px 0 #D9CCF5;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #D9CCF5}
.btn.main{background:linear-gradient(180deg,#FF9BC8,#FF6FAE);color:#fff;border-color:#fff;box-shadow:0 5px 0 #D9558F;text-shadow:0 2px 0 rgba(180,60,110,.5)}
.btn.main:active{box-shadow:0 2px 0 #D9558F}
.btn.gold{background:linear-gradient(180deg,#FFE08A,#FFC24D);color:#6B4A12;border-color:#fff;box-shadow:0 5px 0 var(--gold-deep)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.best{justify-self:center;padding:4px 14px;border-radius:999px;background:#FFF1D6;color:#9A6A12;font-size:15px}
.best b{font-family:var(--f-num)}
.r-title{margin:0;font-size:30px;color:var(--pink-deep);font-weight:400}
.r-score{font-family:var(--f-num);font-weight:700;font-size:56px;line-height:1}
.r-top{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;border-radius:18px;background:#F6F0FF}
.r-top img{width:64px;height:64px;object-fit:contain}
.r-top span{text-align:left;font-size:15px;color:var(--soft)}
.r-top b{display:block;font-size:20px;color:var(--ink)}
.newbest{justify-self:center;padding:3px 16px;border-radius:999px;background:var(--gold);color:#fff;text-shadow:0 1px 0 var(--gold-deep);animation:pulse .8s ease-in-out infinite}
.brag-text{width:100%;user-select:text;-webkit-user-select:text;border:2px solid #EADFFF;border-radius:14px;padding:8px;font:15px/1.5 var(--f-ui);color:var(--ink);resize:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;pointer-events:none;padding:10px 18px;border-radius:16px;background:rgba(74,58,107,.92);color:#fff;font-size:15px;max-width:90vw;text-align:center}
.rank-row input{user-select:text;-webkit-user-select:text}
.rankbox{display:grid;gap:6px;padding:10px;border-radius:18px;background:#FFF4FA;border:2px dashed #FFC2DD}
.rank-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.rank-row input{width:150px;padding:9px 12px;border-radius:999px;border:2px solid #FFD0E6;background:#fff;font-family:var(--f-ui);font-size:16px;color:var(--ink);text-align:center}
.rank-row .btn{min-height:42px;font-size:15px;padding:0 14px}
.rank-msg{margin:0;font-size:13px;color:var(--soft)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (max-height:640px){.parade{display:none}.card{gap:10px;padding:18px 16px}.hero{margin:-18px -16px 0;width:calc(100% + 32px)}}
.rotate{position:fixed;inset:0;z-index:40;display:none;place-items:center;align-content:center;gap:10px;background:linear-gradient(180deg,#FDEBFA,#DDF1FF);color:var(--ink);font-size:22px;text-align:center}
.rotate b{font-size:48px}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.rotate{display:grid}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div class="hud">
    <div class="chip score"><small>SCORE</small><b id="score">0</b></div>
    <div class="chip"><small>BEST</small><b id="bestHud">0</b></div>
    <div class="next" aria-label="다음 동물"><small>NEXT</small><img id="nextImg" alt=""></div>
    <button class="ibtn" id="btnPause" type="button" aria-label="일시정지">Ⅱ</button>
  </div>
  <div id="stage" aria-label="게임판: 눌러서 동물을 떨어뜨려요"></div>
  <div class="chain" id="chain" aria-label="합쳐지는 순서"></div>
  <div class="banner" id="banner"></div>
</div>


<div class="overlay title" id="title">
  <div class="card">
    <img class="hero" src="assets/key.webp" alt="" onerror="this.remove()">
    <h1 class="logo" aria-label="치비 머지"><span>치</span><span>비</span> <span>머</span><span>지</span></h1>
    <p class="tagline">같은 친구끼리 합쳐서 고래까지!</p>
    <div class="parade" id="parade"></div>
    <p class="how">화면을 눌러 <b>위치를 정하고</b> 손을 떼면 떨어져요.<br>같은 동물끼리 닿으면 <b>한 단계 큰 동물</b>로 합쳐져요.<br>점선 위로 쌓인 채 2초가 지나면 끝!</p>
    <span class="best">최고 기록 <b id="bestTitle">0</b></span>
    <button class="btn main" id="btnStart" type="button">게임 시작</button>
    <button class="btn" id="btnSound" type="button">🔊 소리 켜짐</button>
  </div>
</div>


<div class="overlay" id="pause" hidden>
  <div class="card">
    <h2 class="r-title">잠깐 쉬어요</h2>
    <button class="btn main" id="btnResume" type="button">계속하기</button>
    <div class="row">
      <button class="btn" id="btnRestart" type="button">처음부터</button>
      <button class="btn" id="btnQuit" type="button">메인으로</button>
    </div>
    <button class="btn" id="btnSound2" type="button">🔊 소리 켜짐</button>
  </div>
</div>


<div class="overlay" id="result" hidden>
  <div class="card">
    <h2 class="r-title" id="rTitle">게임 끝!</h2>
    <div class="r-score" id="rScore">0</div>
    <div class="newbest" id="rNew" hidden>최고 기록!</div>
    <div class="r-top"><img id="rTopImg" alt=""><span>이번 판 최고<b id="rTopName">병아리</b></span></div>
    <div class="rankbox" id="rankBox" hidden>
      <div class="rank-row"><input id="rankName" maxlength="10" placeholder="카톡방 닉네임" aria-label="랭킹에 쓸 이름 (카톡방 닉네임)" autocomplete="nickname"><button class="btn main" id="btnRankUp" type="button">🏆 랭킹에 올리기</button></div>
      <p class="rank-msg" id="rankMsg"></p>
    </div>
    <button class="btn main" id="btnAgain" type="button">다시 하기</button>
    <div class="row">
      <button class="btn gold" id="btnBrag" type="button">자랑하기</button>
      <button class="btn" id="btnHome" type="button">메인</button>
    </div>
    <textarea class="brag-text" id="bragText" rows="3" readonly hidden aria-label="자랑하기 문구"></textarea>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="rotate" id="rotate"><b>📱</b>세로로 돌려서 해 주세요</div>
