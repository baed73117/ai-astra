<meta property="og:description" content="디저트 소녀들이 과자 왕국을 달리는 무료 러너 게임! 캐릭터마다 다른 특수능력으로 멀리멀리">

<title>스윗 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Outfit:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<style>
/* 스윗 대시: 디저트 소녀들이 과자 왕국을 달리는 러너 게임. 왼쪽 = 점프(두 번 = 2단 점프), 오른쪽 누르고 있기 = 슬라이드
   화면 디자인: 요즘 서브컬처 모바일 게임처럼 — 흰 글자 + 은은한 어두운 깔림, 얇은 선, 선 아이콘, 매끈한 그라데이션 버튼 */
:root{
  --ink:#2A1A3A;--ink2:#7A6890;--pink:#FF5FA2;--pink2:#FF9CCB;--gold:#FFC24A;
  --glass:rgba(24,12,36,.36);--line:rgba(255,255,255,.72);
  --f-kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--f-en:"Outfit","Noto Sans KR",sans-serif;--f-logo:"Black Han Sans","Noto Sans KR",sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:var(--f-kr);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
body{background:#24152F}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
img{-webkit-user-drag:none}
svg{display:block}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{display:inline-block;font:800 11px/1 var(--f-en);letter-spacing:.24em;text-transform:uppercase}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ── 게임 중 표시판 ── */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;padding:calc(10px + var(--safe-t)) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;color:#fff}
.hud::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(128px + var(--safe-t));background:linear-gradient(180deg,rgba(28,14,42,.52),rgba(28,14,42,.2) 55%,rgba(28,14,42,0));z-index:-1}
.hud-l{display:flex;gap:10px;align-items:flex-start;min-width:0}
.me{position:relative;flex:none;width:56px;height:56px;border-radius:17px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.95),0 6px 18px rgba(20,8,30,.35);background:linear-gradient(160deg,var(--c1,#FF8FC0),var(--c2,#FFC2DC))}
.me img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%;transform:scale(1.5);transform-origin:50% 0}
.me::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px rgba(255,255,255,.95)}
.me.ready{box-shadow:0 0 0 2px var(--gold),0 0 20px rgba(255,194,74,.85)}
.bars{display:grid;gap:6px;width:min(46vw,250px);padding-top:4px}
.hp{position:relative;display:flex;align-items:center}
.hp-ic{position:absolute;left:-7px;top:50%;width:24px;height:24px;transform:translateY(-50%);z-index:2;fill:#FF5FA2;stroke:#fff;stroke-width:2.2;filter:drop-shadow(0 2px 3px rgba(20,8,30,.35))}
.hp-track{position:relative;flex:1;height:14px;margin-left:8px;border-radius:999px;background:rgba(20,8,30,.5);box-shadow:inset 0 1px 3px rgba(0,0,0,.35),0 0 0 1.5px rgba(255,255,255,.85);overflow:hidden}
.hp-track b,.hp-track i{position:absolute;inset:0;transform-origin:0 50%;border-radius:999px}
.hp-track i{background:rgba(255,255,255,.78)}
.hp-track b{background:linear-gradient(180deg,#FFA9D2 0%,#FF5FA2 58%,#EE468B 100%)}
.hp-track b::after{content:"";position:absolute;left:7px;right:7px;top:2px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.hp.low .hp-track b{background:linear-gradient(180deg,#FFB48E,#FF5A5A 60%,#E5404A)}
.hp::after{content:"";position:absolute;left:8px;right:0;top:50%;height:14px;margin-top:-7px;border-radius:999px;box-shadow:0 0 0 2px #FF6B6B,0 0 12px rgba(255,80,80,.85);opacity:0;pointer-events:none;will-change:opacity}
.hp.low::after{animation:lowBlink .6s ease-in-out infinite}
.skill{display:flex;align-items:center;gap:6px;margin-left:8px}
.skill span{font:800 9px/1 var(--f-en);letter-spacing:.2em;opacity:.9}
.sk-track{position:relative;flex:1;height:6px;border-radius:999px;background:rgba(20,8,30,.45);box-shadow:0 0 0 1px rgba(255,255,255,.6);overflow:hidden}
.sk-track b{position:absolute;inset:0;transform-origin:0 50%;background:linear-gradient(90deg,#FFE08A,#FFC24A);border-radius:999px}
.sk-track b::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:translateX(-100%);opacity:0}
.skill.on .sk-track b::after{opacity:1;animation:shineX .9s linear infinite}
.letters{display:flex;gap:4px;margin-left:8px}
.letters span{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font:800 11px/1 var(--f-en);color:rgba(255,255,255,.72);background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.5)}
.letters span.on{background:var(--c);color:#fff;box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.95),0 0 10px var(--c);animation:pop .35s ease}
.hud-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hud-r .top{display:flex;align-items:flex-start;gap:10px}
.score{text-align:right;line-height:1;padding-top:2px}
.score small{display:block;font:800 9px/1 var(--f-en);letter-spacing:.26em;opacity:.88;margin-bottom:4px}
.score b{font:800 28px/1 var(--f-en);letter-spacing:.01em;text-shadow:0 2px 10px rgba(20,8,30,.45);font-variant-numeric:tabular-nums}
.subrow{display:flex;align-items:center;gap:12px;font:700 13px/1 var(--f-en);text-shadow:0 1px 6px rgba(20,8,30,.55)}
.coin{display:inline-flex;align-items:center;gap:5px}
.coin i,.coinpill i{flex:none;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6C8,#FFC94D 55%,#D9952A);box-shadow:0 0 0 1.2px rgba(255,255,255,.85)}
.dist{opacity:.88}
.pause{pointer-events:auto;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),0 4px 14px rgba(20,8,30,.25)}
.pause svg{width:16px;height:16px;fill:#fff}

/* ── 조작 버튼 ── */
.pads{position:fixed;left:0;right:0;bottom:0;z-index:4;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 20px calc(22px + var(--safe-b))}
.pad{width:88px;height:88px;border-radius:28px;display:grid;place-items:center;align-content:center;gap:5px;color:#fff;background:var(--glass);box-shadow:inset 0 0 0 1.5px var(--line),inset 0 14px 22px rgba(255,255,255,.08),0 10px 26px rgba(20,8,30,.3);transition:transform .08s ease,background .08s ease,box-shadow .08s ease}
.pad svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.pad span{font:700 12px/1 var(--f-kr);opacity:.95}
.pad.on{transform:scale(.93);background:rgba(255,95,162,.62);box-shadow:inset 0 0 0 1.5px #fff,0 0 26px rgba(255,95,162,.75)}
.hint{position:absolute;left:50%;bottom:calc(128px + var(--safe-b));transform:translateX(-50%);width:max-content;max-width:88vw;padding:10px 16px;border-radius:16px;background:rgba(24,12,36,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff;font:500 13px/1.5 var(--f-kr);text-align:center;transition:opacity .6s}
.hint b{color:#FFB8DA;font-weight:700}

/* ── 능력 컷인 · 알림 띠 ── */
.cutin{position:fixed;left:0;right:0;top:21%;height:172px;z-index:6;pointer-events:none;overflow:hidden;opacity:0}
.cutin.go{animation:cutBand 1.3s ease forwards}
.cutin .band{position:absolute;left:-10%;right:-10%;top:36px;bottom:36px;transform:skewY(-5deg);background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 12px 32px rgba(20,8,30,.28)}
.cutin .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,rgba(255,255,255,.16) 0 2px,transparent 2px 22px)}
.cutin .band::after{content:"";position:absolute;left:0;right:0;top:7px;bottom:7px;border-top:2px solid rgba(255,255,255,.85);border-bottom:2px solid rgba(255,255,255,.85)}
.cutin img{position:absolute;right:0;top:-6px;height:190px;width:58%;max-width:320px;object-fit:cover;object-position:50% 10%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 32%);mask-image:linear-gradient(90deg,transparent,#000 32%)}
.cutin.go img{animation:cutImg 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.cutin .tx{position:absolute;left:6%;top:50%;transform:translateY(-50%);color:#fff;text-shadow:0 2px 12px rgba(20,8,30,.35)}
.cutin .tx small{display:block;font:800 11px/1 var(--f-en);letter-spacing:.3em;margin-bottom:6px}
.cutin .tx b{display:block;font:400 34px/1.05 var(--f-logo);white-space:nowrap}
.cutin .tx em{display:block;font:700 13px/1 var(--f-kr);font-style:normal;margin-top:7px;opacity:.95}
.cutin.go .tx{animation:cutTx 1.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes cutBand{0%{opacity:0}8%{opacity:1}84%{opacity:1}100%{opacity:0}}
@keyframes cutImg{0%{transform:translateX(70%)}18%{transform:translateX(0)}82%{transform:translateX(-5%)}100%{transform:translateX(-12%)}}
@keyframes cutTx{0%{transform:translate(-40%,-50%);opacity:0}18%{transform:translate(0,-50%);opacity:1}84%{opacity:1}100%{transform:translate(8%,-50%);opacity:0}}
.banner{position:fixed;left:0;right:0;top:37%;z-index:6;pointer-events:none;display:grid;place-items:center;opacity:0}
.banner span{position:relative;padding:11px 44px;font:400 25px/1.1 var(--f-logo);color:#fff;text-shadow:0 2px 10px rgba(20,8,30,.35);white-space:nowrap}
.banner span::before{content:"";position:absolute;inset:0 -24px;transform:skewX(-14deg);background:linear-gradient(90deg,rgba(255,95,162,0),rgba(255,95,162,.94) 16%,rgba(255,138,112,.94) 84%,rgba(255,138,112,0));z-index:-1}
.banner.go{animation:bannerIn 1.6s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scaleX(.4)}12%{opacity:1;transform:scaleX(1.04)}20%{transform:scaleX(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.flash{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(255,80,110,0) 45%,rgba(255,60,100,.55) 100%)}
.flash.go{animation:flash .45s ease}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* ── 덮개 화면 공통 ── */
.overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(24,12,36,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{position:relative;width:min(100%,400px);padding:24px 20px 20px;border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 30px 70px rgba(20,8,30,.4);display:grid;gap:12px;text-align:center}
.card .tag{color:var(--pink)}
.c-title{margin:0;font:400 30px/1.1 var(--f-logo);color:var(--ink)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;font:700 16px/1 var(--f-kr);letter-spacing:-.01em;overflow:hidden;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.97)}
.btn:disabled{filter:grayscale(.4) opacity(.6)}
.btn .ico{width:19px;height:19px}
.btn.main{color:#fff;background:linear-gradient(120deg,#FF86BF,#FF4F9A 55%,#FF7C7C);box-shadow:0 12px 26px rgba(255,79,154,.38),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.main::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-20deg);animation:sweep 3.4s ease-in-out infinite}
.btn.xl{min-height:60px;font-size:19px;border-radius:20px}
.btn.gold{color:#4A2E00;background:linear-gradient(120deg,#FFE79A,#FFC24A);box-shadow:0 10px 22px rgba(255,180,50,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.soft{color:var(--ink);background:#F5EFF9;box-shadow:inset 0 0 0 1px #EADFF2}
.btn.glass{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn .x{display:none}
.btn.muted .wv{display:none}.btn.muted .x{display:inline}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ── 첫 화면: 고른 캐릭터 일러스트가 화면 가득 ── */
.overlay.title,.overlay.sel{padding:0;display:block;overflow:hidden;background:#2A1A3A;-webkit-backdrop-filter:none;backdrop-filter:none}
.t-bg{position:absolute;inset:0;background:url(assets/key.webp) center/cover no-repeat,url(assets/bg1.webp) center/cover no-repeat,linear-gradient(180deg,#9FD8FF,#FFD6EA)}
.t-char{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;animation:charIn 1s cubic-bezier(.2,.8,.2,1)}
.t-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(28,14,42,.6) 0%,rgba(28,14,42,0) 24%,rgba(28,14,42,0) 46%,rgba(28,14,42,.74) 72%,rgba(28,14,42,.94) 100%)}
.t-head{position:absolute;left:0;right:0;top:0;padding:calc(18px + var(--safe-t)) 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#fff}
.brand-en{display:block;font:800 12px/1 var(--f-en);letter-spacing:.44em}
.logo{margin:8px 0 6px;font:400 clamp(46px,13vw,66px)/1 var(--f-logo);letter-spacing:.01em;background:linear-gradient(180deg,#FFFFFF 35%,#FFE3F1 62%,#FFB3D6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#fff;filter:drop-shadow(0 3px 0 #F0478C) drop-shadow(0 10px 20px rgba(255,79,154,.45))}
.brand-sub{display:block;font:500 13px/1.3 var(--f-kr);opacity:.94}
.t-best{flex:none;padding:9px 12px;border-radius:14px;background:rgba(24,12,36,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.42);text-align:right;line-height:1}
.t-best small{display:block;font:800 9px/1 var(--f-en);letter-spacing:.26em;opacity:.88;margin-bottom:5px}
.t-best b{font:800 20px/1 var(--f-en)}
.t-foot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(20px + var(--safe-b));display:grid;gap:12px;color:#fff;max-width:520px;margin:0 auto}
.t-runner{display:grid;gap:3px}
.t-runner .tag{color:var(--pink2)}
.t-runner b{font:400 42px/1.05 var(--f-logo)}
.t-runner em{font:700 14px/1.3 var(--f-kr);font-style:normal;opacity:.95}
.t-runner em::before{content:"SKILL"}
.t-runner em::before,.s-skill-h i{display:inline-block;font:800 10px/1 var(--f-en);font-style:normal;letter-spacing:.2em;padding:4px 7px;margin-right:7px;border-radius:6px;background:var(--gold);color:#4A2E00;vertical-align:2px}
.t-how{margin:0;font:500 12px/1.5 var(--f-kr);opacity:.78;text-align:center}
@keyframes charIn{0%{opacity:0;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@media (orientation:landscape) and (min-aspect-ratio:4/3){
  .t-char{left:auto;width:min(58vw,90vh);-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%);mask-image:linear-gradient(90deg,transparent,#000 24%)}
  .t-fade{background:linear-gradient(90deg,rgba(28,14,42,.9),rgba(28,14,42,.45) 42%,rgba(28,14,42,0) 62%)}
  .t-head{right:auto;width:min(470px,46vw)}
  .t-foot{right:auto;left:20px;bottom:calc(20px + var(--safe-b));width:min(430px,44vw);padding:0;margin:0}
}

/* ── 캐릭터 고르기 ── */
.s-art{position:absolute;inset:0;touch-action:pan-y}
.s-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 10%;transition:opacity .25s ease}
.s-art.locked img{filter:saturate(.25) brightness(.68)}
.s-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(28,14,42,.62) 0%,rgba(28,14,42,0) 20%,rgba(28,14,42,0) 36%,rgba(28,14,42,.8) 62%,rgba(28,14,42,.96) 100%)}
.s-top{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 14px 0;display:flex;align-items:center;gap:12px;color:#fff}
.s-top h2{flex:1;margin:0;font:800 13px/1 var(--f-en);letter-spacing:.34em}
.iconbtn{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:rgba(24,12,36,.4);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.62)}
.coinpill{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;background:rgba(24,12,36,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);font:800 16px/1 var(--f-en);color:#fff}
.s-nav{position:absolute;top:36%;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(24,12,36,.35);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.s-nav.l{left:12px}.s-nav.r{right:12px}
.s-lock{position:absolute;top:calc(66px + var(--safe-t));right:14px;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:rgba(24,12,36,.65);color:#fff;font:800 11px/1 var(--f-en);letter-spacing:.22em}
.s-lock .ico{width:15px;height:15px}
.s-panel{position:absolute;left:0;right:0;bottom:0;padding:0 18px calc(16px + var(--safe-b));display:grid;gap:12px;color:#fff;max-width:540px;margin:0 auto}
.s-panel .tag{color:var(--pink2)}
.s-name{display:flex;align-items:baseline;gap:10px;margin-top:-4px}
.s-name h3{margin:0;font:400 46px/1 var(--f-logo)}
.s-name span{font:700 14px/1 var(--f-kr);opacity:.86}
.s-skill{padding:13px 14px;border-radius:18px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.36);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.s-skill-h{display:flex;align-items:center;margin-bottom:6px}
.s-skill-h b{font:700 16px/1.2 var(--f-kr)}
.s-skill-h span{margin-left:auto;font:700 12px/1 var(--f-kr);opacity:.8}
.s-skill p{margin:0;font:500 13px/1.55 var(--f-kr);opacity:.94}
.thumbs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}

    b.style.backgroundImage = `url(${PT_URL(c.key)})`;
    b.addEventListener('click', () => { selIdx = i; renderSel(); });
    th.appendChild(b);
  });
  renderSel();
}
function renderSel() {
  const c = CHARS[selIdx], own = save.owned.includes(c.key);
  $('#selCoins').textContent = fmt(save.coins);
  const card = $('#selCard');
  card.classList.toggle('locked', !own);
  const img = $('#selImg'); img.style.visibility = ''; img.onerror = () => { img.style.visibility = 'hidden'; }; img.src = PT_URL(c.key); img.alt = c.name;
  card.style.background = `linear-gradient(160deg, ${c.c1}, ${c.c2})`;
  $('#selTag').textContent = c.en; $('#selDessert').textContent = c.dessert; $('#selName').textContent = c.name;
  $('#selAbName').textContent = c.abName; $('#selDesc').textContent = c.desc;
  $('#selCd').textContent = c.ab === 'shield' ? `${c.cd}초마다 충전` : `${c.cd}초마다`;
  $('#selLock').hidden = own;
  const go = $('#selGo');
  if (own) { go.textContent = save.sel === c.key ? '이 친구로 달리기' : '이 친구로 바꾸고 달리기'; go.className = 'btn main xl'; }
  else { go.textContent = `코인 ${fmt(c.price)}개로 데려오기`; go.className = save.coins >= c.price ? 'btn gold xl' : 'btn soft xl'; }
  [...$('#thumbs').children].forEach((b, i) => { b.classList.toggle('on', i === selIdx); b.classList.toggle('lk', !save.owned.includes(CHARS[i].key)); });
}
let buyLock = 0;
function selGo() {
  const c = CHARS[selIdx];
  if (performance.now() < buyLock) return;
  if (save.owned.includes(c.key)) { save.sel = c.key; persist(); renderTitle(); startGame(); return; }
  if (save.coins < c.price) { toast(`코인이 ${fmt(c.price - save.coins)}개 더 필요해요. 달리면서 모아 보세요!`); return; }
  save.coins -= c.price; save.owned.push(c.key); save.sel = c.key; persist(); buyLock = performance.now() + 800;
  S.init(); S.bonus(); toast(`${c.name}(이)가 함께 달려요!`);
  renderSel(); renderTitle();
}

let toastT = 0;
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
function soundLabels() { for (const b of [$('#btnSound'), $('#btnSound2')]) { b.classList.toggle('muted', save.muted); b.querySelector('.lbl').textContent = save.muted ? '소리 꺼짐' : '소리 켜짐'; } }
function toggleSound() { save.muted = !save.muted; persist(); S.init(); soundLabels(); }
async function brag() {
  const dm = Math.floor(distU / 40);
  const text = `스윗 대시 ${fmt(score)}점! ${CH.name}(이)랑 ${fmt(dm)}m 달렸어요 🍓\n나도 달려 볼래? → ${SHARE_URL}`;
  const box = $('#bragText');
  try { await navigator.clipboard.writeText(text); box.hidden = true; toast('복사했어요! 카톡에 붙여 넣어 보내 보세요.'); }
  catch (e) { box.value = text; box.hidden = false; box.focus(); box.select(); toast('아래 글을 길게 눌러 복사해 주세요.'); }
}

/* ---------- 입력: 화면 왼쪽 반 = 점프, 오른쪽 반 = 슬라이드 (손가락 여러 개 따로) ---------- */
const touches = new Map();
const stageEl = $('#stage');
function padOn() { $('#padJump').classList.toggle('on', jumpHeld); $('#padSlide').classList.toggle('on', slideHeld); }
stageEl.addEventListener('pointerdown', e => {
  if (state !== 'play' || paused || e.button > 0 || performance.now() < inputLock) return;
  e.preventDefault(); S.init();
  const side = e.clientX < window.innerWidth / 2 ? 'j' : 's';
  touches.set(e.pointerId, side);
  try { stageEl.setPointerCapture(e.pointerId); } catch (_) {}
  if (side === 'j') { jumpHeld = true; doJump(); } else setSlide(true);
  padOn();
});
function release(e) {
  const side = touches.get(e.pointerId); if (!side) return;
  touches.delete(e.pointerId);
  const still = [...touches.values()];
  if (side === 'j') jumpHeld = still.includes('j');
  else setSlide(still.includes('s'));
  padOn();
}
stageEl.addEventListener('pointerup', release);
stageEl.addEventListener('pointercancel', release);
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { if (paused) resumeGame(); else pauseGame(); return; }
  if (state !== 'play' || paused) return;
  if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !e.repeat) { e.preventDefault(); S.init(); jumpHeld = true; doJump(); padOn(); }
  else if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && !e.repeat) { e.preventDefault(); setSlide(true); padOn(); }
});
document.addEventListener('keyup', e => {
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { jumpHeld = false; padOn(); }
  else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { setSlide(false); padOn(); }
});
// 캐릭터 카드 좌우로 밀기
let swX = null;
$('#selCard').addEventListener('pointerdown', e => { swX = e.clientX; });
$('#selCard').addEventListener('pointerup', e => { if (swX === null) return; const d = e.clientX - swX; swX = null; if (Math.abs(d) > 40) { selIdx = (selIdx + (d < 0 ? 1 : CHARS.length - 1)) % CHARS.length; renderSel(); } });

$('#btnStart').addEventListener('click', startGame);
$('#btnAgain').addEventListener('click', startGame);
$('#btnRestart').addEventListener('click', () => { $('#pause').hidden = true; startGame(); });
$('#btnHome').addEventListener('click', goTitle);
$('#btnQuit').addEventListener('click', goTitle);
$('#btnPause').addEventListener('click', pauseGame);
$('#btnResume').addEventListener('click', resumeGame);
$('#btnBrag').addEventListener('click', brag);
$('#btnSound').addEventListener('click', toggleSound);
$('#btnSound2').addEventListener('click', toggleSound);
$('#btnChars').addEventListener('click', openSel);
$('#selBack').addEventListener('click', () => { startSeq++; $('#sel').hidden = true; $('#title').hidden = false; renderTitle(); });
$('#selPrev').addEventListener('click', e => { e.stopPropagation(); selIdx = (selIdx + CHARS.length - 1) % CHARS.length; renderSel(); });
$('#selNext').addEventListener('click', e => { e.stopPropagation(); selIdx = (selIdx + 1) % CHARS.length; renderSel(); });
$('#selGo').addEventListener('click', selGo);
$('#btnRankUp').addEventListener('click', () => RankUI.up(false));
$('#rankName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); RankUI.up(false); } });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); if (S.ctx) S.ctx.suspend().catch(() => {}); } else if (S.ctx && !paused) S.init(); });
window.addEventListener('blur', () => { touches.clear(); jumpHeld = false; setSlide(false); padOn(); pauseGame(); });

// 랭킹: 시트가 이 게임을 받을 준비가 됐을 때만 '랭킹에 올리기'를 보여 준다
let rankSupported = false;
function checkRank() {
  return RankNet.top().then(j => (rankSupported = !!(j && j.ok && j.top && Object.prototype.hasOwnProperty.call(j.top, 'sweetdash')))).catch(() => false);
}
if (RankNet.on) checkRank();

document.addEventListener('pointerdown', function firstTouch() {
  document.removeEventListener('pointerdown', firstTouch, true);
  S.init(); if (state === 'title') BGM.play('title', 1.2);
}, true);
// PC에서는 키보드 안내를 같이
if (!TOUCH) { $('#padJump span').textContent = '점프 · Space'; $('#padSlide span').textContent = '슬라이드 · ↓'; $('#hint').innerHTML = '<b>Space</b>(또는 ↑) 점프 · 한 번 더 누르면 2단 점프<br><b>↓</b> 누르고 있으면 슬라이드 · 화면 왼쪽/오른쪽 클릭도 돼요'; }
renderTitle();
initGraphics().catch(() => {});
})();
</script>

</html>
