  #nv-load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0d0716; color: #cbb8ff; font-family: sans-serif; z-index: 10; }

<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="nv-load"><b>꼬마 저승사자 키우기</b><div id="nv-bar"><div id="nv-fill"></div></div><div id="nv-msg">저승으로 가는 중… 0%</div></div>
<script>
  // 예전 웹판이 남긴 앱 저장(서비스 워커·캐시)을 정리 — 새 유니티판이 확실히 뜨게
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) { }
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('tinyreaper-') === 0) caches.delete(k); }); }); } catch (e) { }
</script>
<script src="Build/build_web.loader.js?h=1db680aad493"></script>
<script>
  var fill = document.getElementById('nv-fill'), msg = document.getElementById('nv-msg');
  if (typeof createUnityInstance !== 'function') nvFail('게임 파일을 받지 못했어요 (인터넷 연결 확인)'); else createUnityInstance(document.querySelector('#unity-canvas'), {
    arguments: [],
    dataUrl: "Build/build_web.data.unityweb?h=7b58ae239cef",
    frameworkUrl: "Build/build_web.framework.js.unityweb?h=9b750eeaa09d",
    codeUrl: "Build/build_web.wasm.unityweb?h=5339b02a94ab",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "AI Astra",
    productName: "꼬마 저승사자 키우기",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),          // 폰 렉 막기: 화면 배율은 최대 2배
  }, function (p) { var v = Math.round(p * 100); fill.style.width = v + '%'; msg.textContent = '저승으로 가는 중… ' + v + '%'; }).then(function () {
    document.getElementById('nv-load').style.display = 'none';
  }).catch(function (m) { nvFail(m); });
  // 불러오기 실패 화면 (10-12 카톡 제보: 글씨가 작고 잘려서 원인을 몰랐음): 기기·브라우저 이름 + 오류 글 + '다시 시도' + 카톡 안이면 다른 브라우저 안내
  function nvFail(m) {
    var ua = navigator.userAgent || '', ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1), and = /Android/.test(ua);
    var os = ios ? 'iOS ' + ((ua.match(/OS (\d+)_(\d+)/) || []).slice(1, 3).join('.') || '') : and ? '안드로이드 ' + ((ua.match(/Android ([\d.]+)/) || [])[1] || '') : /Windows/.test(ua) ? '윈도우' : /Mac OS X/.test(ua) ? '맥' : '기타';
    var inKakao = /KAKAOTALK/i.test(ua), brw = inKakao ? '카카오톡 안 브라우저' : /NAVER/.test(ua) ? '네이버 앱' : /SamsungBrowser/.test(ua) ? '삼성 인터넷' : /Whale/.test(ua) ? '웨일' : /CriOS|Chrome/.test(ua) ? '크롬' : /FxiOS|Firefox/.test(ua) ? '파이어폭스' : /Safari/.test(ua) ? '사파리' : '브라우저';
    var box = document.getElementById('nv-load'); box.innerHTML = '';
    var add = function (tag, txt, css) { var e = document.createElement(tag); e.textContent = txt; e.style.cssText = css; box.appendChild(e); return e; };
    add('b', '꼬마 저승사자 키우기', '');
    add('div', '게임을 불러오지 못했어요', 'font-size:20px;color:#ff9a9a;font-weight:bold');
    var re = add('button', '다시 시도', 'height:48px;padding:0 28px;border-radius:12px;border:2px solid #e2bd62;background:#7a4ad8;color:#fff;font-size:18px;font-weight:bold');
    re.onclick = function () { location.reload(); };
    if (inKakao) add('div', '카카오톡 안에서 계속 안 되면: 오른쪽 위 ⋮ (또는 공유) → 다른 브라우저로 열기', 'font-size:14px;color:#ffe27a;max-width:86vw;text-align:center;line-height:1.5');
    add('div', '이 화면을 찍어 게임방에 알려 주시면 고칠게요', 'font-size:13px;color:#cbb8ff');
    add('div', os + ' · ' + brw + ' · ' + String(m).slice(0, 180), 'font-size:11px;color:#9a8cc0;max-width:90vw;text-align:center;word-break:break-all;line-height:1.4');
  }
</script>
