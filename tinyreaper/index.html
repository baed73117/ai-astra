<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>꼬마 저승사자 키우기 · AI아스트라 공유방</title>

<meta name="theme-color" content="#0d0716">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AI아스트라 공유방">
<meta property="og:title" content="꼬마 저승사자 키우기 · AI아스트라 공유방">
<meta property="og:description" content="한복 입은 꼬마 저승사자가 저승을 누비는 무료 방치형 RPG! 자동 사냥 · 능력치 수련 · 낫 소환과 강화 · 컬렉션 · 보석으로 쑥쑥 강해져요.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://baed73117.github.io/ai-astra/tinyreaper/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://baed73117.github.io/ai-astra/tinyreaper/og.jpg">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="app/apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0d0716; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #0d0716; outline: none; }
  #nv-load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #0d0716; color: #cbb8ff; font-family: sans-serif; z-index: 10; }
  #nv-load b { font-size: 28px; color: #ffe27a; letter-spacing: 1px; }
  #nv-bar { width: min(70vw, 360px); height: 14px; border: 2px solid #9c7fe0; border-radius: 9px; overflow: hidden; background: #160a26; }
  #nv-fill { width: 0; height: 100%; background: linear-gradient(90deg, #7a4ad8, #c58bff); }
  #nv-msg { font-size: 15px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="nv-load"><b>꼬마 저승사자 키우기</b><div id="nv-bar"><div id="nv-fill"></div></div><div id="nv-msg">저승으로 가는 중… 0%</div></div>
<script>
  // 예전 웹판이 남긴 앱 저장(서비스 워커·캐시)을 정리 — 새 유니티판이 확실히 뜨게
  try { if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) { }
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('tinyreaper-') === 0) caches.delete(k); }); }); } catch (e) { }
</script>
<script src="Build/build_web.loader.js"></script>
<script>
  var fill = document.getElementById('nv-fill'), msg = document.getElementById('nv-msg');
  createUnityInstance(document.querySelector('#unity-canvas'), {
    arguments: [],
    dataUrl: "Build/build_web.data.unityweb",
    frameworkUrl: "Build/build_web.framework.js.unityweb",
    codeUrl: "Build/build_web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "AI Astra",
    productName: "꼬마 저승사자 키우기",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),          // 폰 렉 막기: 화면 배율은 최대 2배
  }, function (p) { var v = Math.round(p * 100); fill.style.width = v + '%'; msg.textContent = '저승으로 가는 중… ' + v + '%'; }).then(function () {
    document.getElementById('nv-load').style.display = 'none';
  }).catch(function (m) {
    msg.style.color = '#ff9a9a'; msg.textContent = '게임을 불러오지 못했어요. 새로 고침해 주세요. (' + String(m).slice(0, 80) + ')';
  });
</script>
</body>
</html>
