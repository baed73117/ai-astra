<script>
'use strict';
/* =====================================================================
   프로젝트 노바 「꼬마 저승사자 키우기」 — C1단계 (진짜 그림·타이틀·주인공 고르기·효과음·배경음) · B단계(조이스틱·보스 예고·낫 기술·장비·잠든 사이 수확·기록 옮기기)까지 포함
   구성: ① CFG(모든 숫자·상한) ② 저장 ③ 계산식 ④ 전투 계산(그리기 없음, 1/30초 고정 간격)
         ⑤ ART(그림 모음 — 나중에 그림만 갈아 끼우는 곳) ⑥ 화면(Pixi) ⑦ 입력 ⑧ 시험용 훅(?debug)
   ===================================================================== */

/* ===================== ① 설정 (CFG) — 숫자·상한은 전부 여기 한 곳 ===================== */
const GAME_ID = 'tinyreaper';                 // 저장 키 tinyreaper-v1 (gdd 11-1). 시험은 __nova.saveKey로 읽는다
const SAVE_KEY = GAME_ID + '-v1', BAK_KEY = SAVE_KEY + '-bak', PERF_KEY = GAME_ID + '-perf';
const CFG = {
  // 화면 (가로 720 고정, 세로는 비율에 맞춰 H_MIN~H_MAX)
  WW: 720, H_MIN: 1180, H_MAX: 1560, TOP_H: 120, TAB_H: 100, PANEL_TOP: 0.5, PANEL_ANIM: 14,
  // 맵 (탑다운 바닥) · 카메라
  MAP_W: 1440, MAP_H: 2400, MAP_MARGIN: 90, CAM_LERP: 9, CAM_PANEL_TOP: 40, CAM_PANEL_FEET: 120,      // 창이 열렸을 때 주인공 자리: 정보판 아래 여백 · 발 기준 보정
  // 시간
  STEP: 1 / 30, MAX_FRAME_DT: 0.25, MAX_STEPS: 6, UI_TICK: 0.25, SAVE_EVERY: 5, SAVE_MIN_GAP: 0.3,
  // 렉 상한
  MON_MAX: 8, DMG_TXT_MAX: 24, COIN_MAX: 12, PARTICLE_MAX: 150, FX_MAX: 12, PET_ORB_MAX: 3, FX_AREA_MAX: 3.7e6, EMBER_MAX: 24, DECOR_MAX: 36, DMG_MERGE: 0.15,
  // 수련 = 능력치 8종 (사신키우기처럼: 공격력·마력·체력·MP·치명타 확률·치명타 피해·저승타 확률·저승타 피해) + 단계제(단계마다 레벨 상한 TIER_LV, 모두 MAX면 다음 단계)
  ATK0: 10, ATK_STEP: 0.10, ATK_MILE: 23, MAG0: 10,
  HP0: 100, HP_STEP: 0.10, HP_MILE: 23, MP_STEP: 2,
  ASPD_BASE: 1.4,                                              // 평타 속도 (고정 — 사신키우기처럼 수련으로는 안 오름)
  CRIT_STEP: 0.003, CRIT_CAP: 0.3, CD0: 1.5, CD_STEP: 0.02,
  JT_STEP: 0.002, JT_CAP: 0.2, JD0: 3.0, JD_STEP: 0.1,        // 저승타: 확률 최대 20% · 피해 300%부터 (치명타와 따로 곱함)
  TIER_LV: 50, SKILL_MAG: 0.35, CRIT_TOTAL_CAP: 0.8,          // 단계당 레벨 상한(1차 패치: 100→50, 봇 3일 내내 1단계라 단계가 안 보였음) · 전투력에서 기술(마력) 몫 · 치명 확률 합계 상한
  COST: { atk: [15, 1.105], mag: [15, 1.105], hp: [20, 1.105], mp: [30, 1.1], crit: [60, 1.12], cd: [80, 1.12], jt: [100, 1.13], jd: [100, 1.12] },   // [처음 비용, 레벨마다 배율]
  // 스킬 포인트 패시브 (레벨업마다 1점): [점마다 효과, 최대 점수] — 저승 지혜 공격력 · 명부 지혜 마력 · 혼백 지혜 체력 · 월광 지혜 치명 확률
  PAS: { a: [0.02, 200], m: [0.02, 200], h: [0.02, 200], c: [0.005, 40] },
  // 낫 (사신키우기 '사신의 낫'): 등급 6(하급~전설) × 하위 4~1등급 = 24종(번호 0~23) · 장착 효과 = 공격력·마력 +SC_EQ0×SC_EQG^번호
  //   · 보유 효과(한 번이라도 가진 종류마다) = 장착 효과 × SC_OWN · 같은 낫 SC_MERGE개 → 다음 번호 · 혼불로 소환 · 몬스터 드롭
  SC_EQ0: 0.05, SC_EQG: 1.25, SC_OWN: 0.2, SC_MERGE: 4, SC_SUMMON: 10, SC_SUMMON11: 100,
  // 소환 등급 확률(하급~초월) — 소환 레벨 1~5 (사신키우기 소환레벨: 많이 뽑을수록 좋은 등급이 잘 나옴) · 하위 확률(4~1등급)
  SC_GWL: [[60, 28, 9, 2.5, 0.45, 0.05, 0, 0], [52, 31, 12, 4, 0.85, 0.14, 0.01, 0], [44, 33, 15, 6, 1.6, 0.35, 0.05, 0], [36, 34, 18, 8.5, 2.6, 0.75, 0.14, 0.01], [28, 34, 21, 11.5, 4, 1.2, 0.27, 0.03]],
  SC_SUMLV: [0, 110, 330, 770, 1650], SC_SW: [50, 30, 15, 5],     // 소환 레벨이 오르는 누적 소환 횟수
  SC_PITY: 100, SC_PITY_G: 4,                      // 천장: 소환 100번 안에 영웅(등급 4) 이상이 한 번도 안 나오면 100번째는 영웅 이상 확정
  SC_DROP: 0.018, SC_BOSS_DROP: 0.12,            // 보스 방은 보스가 계속 다시 나오니 드롭은 낮게
  // 드롭 등급 확률 (하급~초월) — 챕터 1~5 · 타락 1~5(챕터 6~10) · 11부터는 마지막 줄. 1차 패치: 전설이 너무 일찍(봇 3시간) 끝나서 천천히 좋아지게
  //   신화는 타락 4부터 아주 드물게, 초월은 드롭 없음(합성·소환으로만) — 봇: 3시간 영웅 · 하루 전설 · 3일 전설 1~신화 · 초월은 몇 달
  SC_DW: [[80, 18, 2, 0, 0, 0, 0, 0], [60, 30, 9, 1, 0, 0, 0, 0], [45, 35, 15, 4.5, 0.5, 0, 0, 0], [34, 38, 21, 6.2, 0.8, 0, 0, 0], [28, 38, 24, 8.6, 1.4, 0, 0, 0],
    [24, 37, 26, 10.5, 2.3, 0.2, 0, 0], [20, 36, 28, 12.4, 3.2, 0.4, 0, 0], [17, 35, 29, 14, 4.3, 0.6, 0, 0], [14, 34, 30, 15.6, 5.4, 0.75, 0.02, 0], [12, 34, 30, 17, 6, 0.95, 0.05, 0]],
  DAILY_ALL: { f: 50, s: 5 },                     // 일일 과제를 모두 끝내면 받는 보상
  // 도전 콘텐츠 (2차 패치) — 챕터 1 보스를 잡으면 열림
  //   주간 대왕(사신키우기 수호 드래곤처럼 점수형): 60초 동안 넣은 피해 = 점수 · 하루 3번(매일 0시 충전) · 이번 주 최고 점수로 주간 랭킹 · 예고 공격이 더 잦고 아픔
  WK_T: 60, WK_TIX: 3, WK_GAP: 3.2, WK_HIT: 0.15, WK_SCALE: 1.55, WK_RW: { f: 10, s: 3 }, WK_BEST_RW: { f: 10 },
  //   명부의 탑(사신키우기 천계감옥처럼): 층마다 3분 안에 몬스터를 다 잡으면 다음 층 · 처음 깬 층만 보상 · 5층마다 보스 · 몬스터 세기 s = TW_S0 + TW_SG × 층
  //   황금 곳간(사신키우기 미믹 농장처럼): 3분 · 하루 3번 · 들어갈 수 있는 가장 센 사냥터 세기 · 몬스터 체력 ×GD_HP · 잡을 때마다 골드 ×GD_GOLD (바로 가방에)
  GD_T: 180, GD_TIX: 3, GD_HP: 0.6, GD_GOLD: 6,
  // 황금 도깨비(사신키우기 보물오리처럼): 챕터 2부터 일반 사냥터에 아주 가끔 · 도망다님 · TR_T초 뒤 사라짐 · 체력 ×TR_HP · 잡으면 골드 ×TR_GOLD + 혼불·영혼석

let seed = (Math.random() * 4294967295) >>> 0 || 1;
function rnd() { let x = seed; x ^= x << 13; x ^= x >>> 17; x ^= x << 5; seed = x >>> 0; return seed / 4294967296; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUF = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];      // 한국식 네 자리 단위 (사신키우기처럼 만·억·조·경·해…)
function fmt(n) {
  if (!(n >= 0)) return '0';
  n = Math.floor(n + 1e-6);
  if (n < 10000) return String(n);
  let e = Math.min(Math.floor(Math.log10(n) / 4), SUF.length - 1), v = n / Math.pow(10000, e), d = v >= 100 ? 0 : v >= 10 ? 1 : 2, s = v.toFixed(d);
  if (parseFloat(s) >= 10000 && e < SUF.length - 1) { e++; v = n / Math.pow(10000, e); s = v.toFixed(2); }
  if (s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, '');          // 3.00억 → 3억 · 2.50만 → 2.5만
  return s + SUF[e];
}
